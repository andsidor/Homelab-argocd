  name: cloudflared-config
  namespace: cloudflare  
data:
  # custom init script
  config.yml: |
    tunnel: 7b67c126-e5a9-4082-aec7-2cebf184d331
    credentials-file: /home/sidor/.cloudflared/7b67c126-e5a9-4082-aec7-2cebf184d331.json # this is the path we will mount the tunnel json file
    no-autoupdate: true

    ingress:
      - hostname: argo.andrzejsidor.online
        service: http://nginx:8888  # this should be the correct dns and port for your service
      - service: http_status:404
