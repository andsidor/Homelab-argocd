---

services:
  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    labels:
    # Traefik common
      - traefik.enable=true
      # SSL by Nginx Proxy Manager
    # Traefik HTTP to HTTPS redirection
      - traefik.docker.network=traefik

    # Traefik v1
      - traefik.frontend.rule=Host:homepage.andrzejsidor.online
      - traefik.port=80

    # Traefik v2
      - traefik.http.routers.wallabag.rule=Host(`homepage.andrzejsidor.online`)
      - traefik.http.routers.wallabag.loadbalancer.server.port=80
      - traefik.http.routers.wallabag.entrypoints=websecure
      - traefik.http.routers.wallabag.tls=true


    
    ports:
      - 4000:8080
    volumes:
      - ./conf.yml:/app/public/conf.yml
    environment:
      - NODE_ENV=production
      - TZ=UTC
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 1m
      timeout: 3s
      retries: 3
      start_period: 30s

networks:
  default:
    external: true
    name: traefik